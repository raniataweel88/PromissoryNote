<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>طباعة الكمبيالات</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

<div class="form-wrapper">  
  <h2>إدخال بيانات الكمبيالة</h2>

  <!-- بيانات المدين -->
  <div class="form-row">
    <div class="field">
      <label>اسم المدين</label>
      <input id="debtor" type="text">
    </div>
    <div class="field">
      <label>عنوان المدين</label>
      <input id="debtorAddress" type="text">
    </div>
  </div>

  <!-- الكفيل الأول -->
  <div class="form-row">
    <div class="field">
      <label>الكفيل الأول</label>
      <input id="guarantor1" type="text">
    </div>
    <div class="field">
      <label>عنوان الكفيل الأول</label>
      <input id="guarantor1Address" type="text">
    </div>
  </div>

  <!-- الكفيل الثاني -->
  <div class="form-row">
    <div class="field">
      <label>الكفيل الثاني</label>
      <input id="guarantor2" type="text">
    </div>
    <div class="field">
      <label>عنوان الكفيل الثاني</label>
      <input id="guarantor2Address" type="text">
    </div>
  </div>
  <!-- المبلغ -->
  <div class="form-row">
      <div class="field">
      <label> عدد كمبيالات</label>
      <input id="numbers" type="number" min="0">
    </div>
    <div class="field">
      <label>المبلغ بالدينار</label>
      <input id="amountDinar" type="number" min="0">
    </div>
    <div class="field">
      <label>المبلغ بالفلس</label>
      <input id="amountFils" type="number" min="0" max="999">
    </div>

  </div>



  <!-- نص الدفع -->
  <div class="form-row">
    <div class="field">
      <label>ادفع لأمر</label>
      <input id="payTo" type="text">
    </div>
    <div class="field">
      <label>المبلغ بالحروف</label>
      <input id="amountText" type="text">
    </div>
  </div>

  <!-- التواريخ -->
  <div class="form-row">
    <div class="field">
      <label>تاريخ الاستحقاق</label>
      <input id="dueDate" type="date">
    </div>
    <div class="field">
      <label>تاريخ التحرير</label>
      <input id="issueDate" type="date">
    </div>
  </div>




  <!-- أزرار التحكم -->
  <div class="buttons">
    <button id="btnExport">🖨️ طباعة PDF</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="javascript.js"></script>
</body>
</html>
